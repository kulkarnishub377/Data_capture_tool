[App]
# true = Flask debug mode + DEBUG logging (detailed errors in the console). Keep on while setting up.
DEBUG = true
# Address to listen on. 0.0.0.0 = reachable from other machines on the network; 127.0.0.1 = this machine only.
# (There is no login: use a trusted network, and allow the port in the firewall.)
HOST = 0.0.0.0
# TCP port of the web UI (1 - 65535). Change it here, then restart the service.
PORT = 5100

[Paths]
# Folder scanned for *.pt models (the model dropdown lists these).
# Deployment device (Jetson, user nvidia): the absolute path works whichever user starts the service.
# Also accepted: ~/_VIDES/... (home of the user running the service), a path relative to this file,
# or a path starting with / (filesystem root).
MODELS_DIR = /home/nvidia/_VIDES/_backend_service_combined/models
# Where captured images are written
OUTPUT_DIR = ./captures

[Model]
# Active model file (inside MODELS_DIR) - custom or stock COCO (e.g. bestv10_s.pt or yolov8s.pt)
MODEL = bestv10_s.pt
# auto | cpu | cuda:0 | cuda:0,cuda:1   (cameras are spread round-robin over the listed GPUs)
DEVICE = auto
# FP16 on CUDA GPUs
HALF = true
CONF_THRESH = 0.49
IMG_SIZE = 640
# Comma-separated class NAMES to capture. Empty = auto
# (COCO model: car,motorcycle,bus,truck; custom model: all its classes)
CLASSES =

[Capture]
# frame (default) | crop | both
SAVE_MODE = frame
# true = write a .json next to each image (class, conf, track, bbox, time, camera, model)
SAVE_METADATA = false
# best  = keep the best frame of each vehicle in a buffer (a better frame replaces the older one) and save once
#         when the vehicle leaves the ROI (recommended). first = save the first good frame immediately.
WHEN = best
MIN_BOX = 40
MIN_ROI_OVERLAP = 0.5
JPEG_QUALITY = 95
PAD_NORMAL = 0.15
PAD_BIKE = 0.4
# A track that appears where a just-lost vehicle was expected within this many seconds is the SAME vehicle
# (tracker ID switch), so it is not saved twice. Keep small so the NEXT vehicle in the lane is still captured.
DEDUP_SECONDS = 2
# A vehicle that stays inside the ROI (stopped / traffic jam) is saved after this many seconds.
MAX_HOLD_SECONDS = 10
