[Paths]
# Folder scanned for *.pt models (the model dropdown lists these)
MODELS_DIR = ../models
# Where captured images are written
OUTPUT_DIR = ./captures

[Model]
# Default model file (inside MODELS_DIR) - custom or stock COCO (e.g. yolov8s.pt)
MODEL = yolov8s.pt
# auto | cpu | cuda:0 | cuda:0,cuda:1
DEVICE = auto
# FP16 on CUDA GPUs
HALF = true
CONF_THRESH = 0.25
IMG_SIZE = 640
# Comma-separated class NAMES to capture. Empty = auto
# (COCO model: car,motorcycle,bus,truck; custom model: all its classes)
CLASSES =

[Capture]
# frame (default) | crop | both
SAVE_MODE = frame
# true = write a .json next to each image (class, conf, track, bbox, time, camera, model)
SAVE_METADATA = false
# first = save when vehicle first qualifies in ROI; best = best frame before it leaves ROI
WHEN = first
MIN_BOX = 40
MIN_ROI_OVERLAP = 0.5
JPEG_QUALITY = 95
PAD_NORMAL = 0.15
PAD_BIKE = 0.40
DEDUP_SECONDS = 30
